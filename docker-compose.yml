services:
  bilidown:
    # 直接拉取 GitHub Actions 构建好的镜像(amd64 / arm64 自动匹配),不用下载源码
    image: ghcr.io/lu8010252/bilidown:latest
    # 想自己本地构建的话,注释掉上面的 image,改用下一行:
    # build: .
    container_name: bilidown
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      - TZ=Asia/Shanghai
      # 访问密码（HTTP Basic 认证）：格式 用户名:密码。务必修改！留空则不设防，仅限纯内网使用
      - BILIDOWN_AUTH=admin:change-me
      # 磁盘保护：下载分区剩余空间低于该值（MB）时拒绝新任务；0 为关闭
      - BILIDOWN_MIN_FREE_MB=1024
    volumes:
      - ./data:/data          # 数据库（登录状态、任务记录）
      - ./download:/app/download   # 下载中转目录，建议换成大容量 U 盘/硬盘路径
    mem_limit: 512m
    # 容器内 DNS。部分机顶盒的系统 DNS 指向本机(127.0.0.1)，容器用不了，会出现“加载二维码失败”。
    # 这里用阿里/腾讯公共 DNS；如果你有自己的 DNS 服务，改成它的局域网 IP 即可
    dns:
      - 223.5.5.5
      - 119.29.29.29
