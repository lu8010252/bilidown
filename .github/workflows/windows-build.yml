name: Build Windows exe

# 手动运行：Actions 页面 → Build Windows exe → Run workflow，完成后在运行结果底部的 Artifacts 下载
# 发布版本：推送形如 v1.0.0 的 tag，会自动构建并把 zip 挂到 Releases
on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths:
      - 'client/**'
      - 'server/**'
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: client
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build bilidown.exe
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go mod tidy
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../dist/bilidown/bilidown.exe .

      # ffmpeg 取自上游 iuroc/bilidown 发布包里的精简版（约 11 MB，只含合并音视频所需功能），
      # 不用完整版（约 100 MB）。固定版本并校验 SHA256，防止下载内容被替换。
      - name: Download ffmpeg (from upstream release)
        env:
          UPSTREAM_TAG: v2.1.1
          FFMPEG_SHA256: b8033a449be3b0b6235b2bbef0837adf79ea3545a78300f81ba21510d231494d
        run: |
          curl -fL --retry 3 -o upstream.zip "https://github.com/iuroc/bilidown/releases/download/${UPSTREAM_TAG}/bilidown_Windows_x86_64.zip"
          mkdir -p dist/bilidown/bin
          unzip -j upstream.zip 'bin/ffmpeg.exe' -d dist/bilidown/bin
          echo "${FFMPEG_SHA256}  dist/bilidown/bin/ffmpeg.exe" | sha256sum -c -
          cp windows/README.txt dist/bilidown/README.txt

      - name: Pack
        run: |
          NAME=bilidown-windows-amd64
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${NAME}-${GITHUB_REF_NAME}"; fi
          echo "ZIP_NAME=${NAME}" >> "$GITHUB_ENV"
          cd dist && zip -r "${NAME}.zip" bilidown

      # Artifact 上传目录而不是 zip：GitHub 会自动把 artifact 打成 zip，
      # 如果这里再传 zip 文件就会变成“压缩包套压缩包”。
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/bilidown

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" "dist/${ZIP_NAME}.zip" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          else
            # 推送分支：更新固定的 windows-latest 发布，始终是最新构建
            TAG="windows-latest"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create "$TAG" "dist/${ZIP_NAME}.zip" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Windows 最新构建" \
              --notes "由 ${GITHUB_SHA::7} 自动构建，解压后双击 bilidown.exe（已含 ffmpeg）。"
          fi
