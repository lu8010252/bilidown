name: Build Windows exe

# 手动运行：Actions 页面 → Build Windows exe → Run workflow，完成后在运行结果底部的 Artifacts 下载
# 发布正式版（最简单）：修改 windows/VERSION 里的版本号并推送，会自动发布成同名 Release（已发布过的版本只补传缺失的 zip）。
# 也可以：Actions 页面 → Run workflow，在 version 里填 v1.0.0；或推送形如 v1.0.0 的 tag。都会把 zip 挂到 Releases
on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号，如 v1.0.0（留空则只构建，更新 windows-latest 预发布）'
        required: false
        default: ''
  push:
    branches: [windows]
    paths:
      - 'client/**'
      - 'server/**'
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: client
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build bilidown.exe
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go mod tidy
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../dist/bilidown/bilidown.exe .

      # ffmpeg 取自上游 iuroc/bilidown 发布包里的精简版（约 11 MB，只含合并音视频所需功能），
      # 不用完整版（约 100 MB）。固定版本并校验 SHA256，防止下载内容被替换。
      - name: Download ffmpeg (from upstream release)
        env:
          UPSTREAM_TAG: v2.1.1
          FFMPEG_SHA256: b8033a449be3b0b6235b2bbef0837adf79ea3545a78300f81ba21510d231494d
        run: |
          curl -fL --retry 3 -o upstream.zip "https://github.com/iuroc/bilidown/releases/download/${UPSTREAM_TAG}/bilidown_Windows_x86_64.zip"
          mkdir -p dist/bilidown/bin
          unzip -j upstream.zip 'bin/ffmpeg.exe' -d dist/bilidown/bin
          echo "${FFMPEG_SHA256}  dist/bilidown/bin/ffmpeg.exe" | sha256sum -c -
          cp windows/README.txt dist/bilidown/README.txt

      - name: Pack
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          NAME=bilidown-windows-amd64
          # 显式指定的版本：手动运行填写的 version，或推送的 tag
          VERSION="${INPUT_VERSION}"
          if [ -z "$VERSION" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          if [ -n "$VERSION" ]; then NAME="${NAME}-${VERSION}"; fi
          # 文件版本：windows/VERSION 里的版本号（tag 名与文件内容完全一致）
          FILE_VERSION=""
          if [ -z "$VERSION" ] && [ -f windows/VERSION ]; then FILE_VERSION="$(tr -d ' \r\n' < windows/VERSION)"; fi
          echo "ZIP_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${FILE_VERSION}" >> "$GITHUB_ENV"
          cd dist && zip -r "${NAME}.zip" bilidown

      # Artifact 上传目录而不是 zip：GitHub 会自动把 artifact 打成 zip，
      # 如果这里再传 zip 文件就会变成“压缩包套压缩包”。
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/bilidown

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 发布 / 补传某个版本：不存在就创建；已存在则只在缺少该 zip 时补传，不覆盖已有文件
          publish_version() {
            local tag="$1" zip="$2" force="$3"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [ "$force" = "1" ] || ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$(basename "$zip")"; then
                gh release upload "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
              fi
            else
              gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --title "$tag" --generate-notes
            fi
          }

          if [ -n "${VERSION}" ]; then
            publish_version "$VERSION" "dist/${ZIP_NAME}.zip" 1
          else
            # 推送分支：更新固定的 windows-latest 发布，始终是最新构建
            TAG="windows-latest"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create "$TAG" "dist/${ZIP_NAME}.zip" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Windows 最新构建" \
              --notes "由 ${GITHUB_SHA::7} 自动构建，解压后双击 bilidown.exe（已含 ffmpeg）。"
            # windows/VERSION 里的版本号：自动发布成正式版
            if [ -n "${FILE_VERSION}" ]; then
              VZIP="dist/bilidown-windows-amd64-${FILE_VERSION}.zip"
              cp "dist/${ZIP_NAME}.zip" "$VZIP"
              publish_version "$FILE_VERSION" "$VZIP" 0
            fi
          fi
